<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1440">
  <meta name="color-scheme" content="dark">
  <title>Лимб</title>
  <script>
    (function () {
      function check() {
        var small = Math.min(screen.width, screen.height) < 820;
        var touch = matchMedia("(pointer:coarse)").matches || navigator.maxTouchPoints > 0;
        document.documentElement.classList.toggle("is-touch", small && touch);
      }
      check();
      addEventListener("resize", check);
      matchMedia("(pointer:coarse)").addEventListener("change", check);
    })();
  </script>
  <script>
    (function () {
      var SEL = ".site-header a, .back-link, .menu-row, .text-button, " +
        "#home .section-picture, .characters-grid .portrait, " +
        ".hand-open-link, .open-image-link, .image-button, " +
        ".lm-zoom button, .lm-chapter, button[data-zoom], .view-dots button";
      document.addEventListener("pointerdown", function (e) {
        if (!document.documentElement.classList.contains("is-touch")) return;
        var el = e.target.closest(SEL);
        if (!el || el.disabled) return;
        el.classList.add("tap");
        setTimeout(function () { el.classList.remove("tap"); }, 350);
      }, { passive: true });
    })();
  </script>
  <link rel="icon" type="image/png" sizes="48x48" href="./favicon.png">
  <link rel="stylesheet" href="./styles.css">
  <script src="./content.js" defer></script>
  <script src="./app.js" defer></script>
  <script src="./fixes.js" defer></script>
  <script src="./fixes-2.js" defer></script>
  <script src="./timeline.js" defer></script>
  <script src="./hints.js" defer></script>
  <link rel="stylesheet" href="./effects.css">
  <link rel="stylesheet" href="./effects-extra.css">
</head>

<body>
  <a class="skip-link" href="#main">К содержимому</a>

  <header class="site-header">
    <a class="home-link" href="#home">На главную</a>

    <nav aria-label="Основное меню">
      <a href="#bible">Библия</a>
      <a href="#maps">Карта</a>
      <a href="#characters">Персонажи</a>
    </nav>

    <div class="external-links">
      <a id="ficbook-link" target="_blank" rel="noopener noreferrer">
        <img class="hand-icon" data-ui="hand"
             alt="" width="48" height="32" loading="lazy">
        <span>Фикбук</span>
      </a>
      <a id="tiktok-link" target="_blank" rel="noopener noreferrer">
        <img class="hand-icon" data-ui="hand"
             alt="" width="48" height="32" loading="lazy">
        <span>TikTok</span>
      </a>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <section id="home" class="page home-page"
             aria-labelledby="home-title">
      <div class="home-heading">
        <h1 id="home-title">LIMB</h1>
        <p>* от лат. limbus — рубеж, предел, граница</p>
      </div>

      <img class="hero-creature" data-art="creature"
           alt="" width="1200" height="500"
           loading="eager" decoding="async">

      <section class="paper-section" aria-label="О мире и метки">
        <div class="paper-content">
          <ul class="tags" id="tags" aria-label="Метки"></ul>
          <div class="annotation" id="annotation"></div>
        </div>
      </section>

      <nav class="section-cards" id="section-cards"
           aria-label="Разделы сайта"></nav>

      <section id="cover-section" class="cover-section" hidden
               aria-label="Обложки">
        <h2>Обложки</h2>
        <div id="cover-image"></div>
        <div class="cover-controls">
          <button id="cover-prev" class="image-button"
                  aria-label="Предыдущая обложка">
            <img data-ui="previous" alt=""
                 width="160" height="64" loading="lazy">
          </button>
          <span id="cover-counter" aria-live="polite"></span>
          <button id="cover-next" class="image-button"
                  aria-label="Следующая обложка">
            <img data-ui="next" alt=""
                 width="160" height="64" loading="lazy">
          </button>
        </div>
      </section>
    </section>

    <section id="bible" class="page inner-page" hidden>
      <h1>Библия</h1>
      <nav class="outline-menu" id="bible-menu"
           aria-label="Разделы Библии"></nav>
    </section>

    <section id="origin" class="page article-page" hidden>
      <h1>Библия</h1>
      <h2>Миросоздание</h2>
      <ul class="text-panel" id="origin-list"></ul>
      <img class="article-art" data-art="powerPlant"
           alt="" width="1200" height="600"
           loading="lazy" decoding="async">
    </section>

    <section id="rules" class="page article-page" hidden>
      <h1>Библия</h1>
      <h2>Мироустройство</h2>
      <ul class="text-panel" id="rules-list"></ul>
      <img class="article-art" data-art="creature"
           alt="" width="1200" height="500"
           loading="lazy" decoding="async">
    </section>

    <section id="timeline" class="page
